<!doctype html>
<html lang="es">
<meta charset="utf-8" />
<style>html, body { margin: 0; background: #000; } canvas { display: block; }</style>
<canvas id="c" width="1080" height="1920"></canvas>
<script type="module">
// "Si eres Escorpio, no pases este video" — ~20 s. Venus retrograde in
// Scorpio, until it leaves on 25 Oct 2026 (05:00 in Lima, per JPL's DE421);
// after that this video is out of date, not just its date line.
import { astramiaReads, chip, cta, DURATION, glyph, goldLine, ifYouAre, LEAD, line, P, pops, punch, retrogradeIn, shown, start, words } from "./kit.js";

const cuts = [0, P.venus.start - LEAD, P.alguien.start - LEAD, P.revisas.start - LEAD, P.astramia.start - LEAD, P.carta.start - LEAD, P.empieza.end + 0.25, DURATION];

start({
  symbol: "♏",
  constellation: "escorpio",
  cuts,
  goal: 5,
  hook: ifYouAre("Escorpio"),
  scenes: [
    // Why now: Venus is retrograde in their sign, for a few more days.
    (t, l, a) => retrogradeIn(t, l, a, {
      from: cuts[1] + 0.2, to: cuts[2],
      lead: "Venus está", word: P.venus.words[2].start,
      sign: "justo en tu signo", signAt: P.signo.start,
      until: "hasta el 24 de octubre", untilAt: P.fecha.start,
    }),
    // The first word is up with the cut; "cabeza" waits, blurred, until it's said.
    (t, l, a) => {
      glyph(t, 0.1 * a);
      const [w1, w2] = [P.alguien.words.map((w) => w.start), P.cabeza.words.map((w) => w.start)];
      words(["por", "eso", "alguien"], 330, [cuts[2], w1[1], w1[2]], { size: 104, alpha: a }, t);
      words([{ text: "que", gold: false }, { text: "ya", gold: true }, { text: "se", gold: true }, { text: "fue", gold: true }], 460, w1.slice(3), { size: 104, italic: true, alpha: a }, t);
      words(["sigue", "en", "tu", { text: "cabeza", gold: true, blurUntil: w2[3] - 0.1 }], 600, [w2[0], w2[1], w2[2], w2[0]], { size: 104, alpha: a }, t);
    },
    // What that looks like at 2 a.m.: things they do, not things they are.
    (t, l, a) => {
      chip("últ. vez hoy a las 2:14 a. m.", 250, a, { size: 34, dot: "#3ddc84" });
      line("Revisas si se conectó.", 400, { size: 92, alpha: a, scale: punch(l) });
      const second = shown(t, P.relees.start, 0.2);
      line("Relees el chat.", 530, { size: 92, alpha: a * second, dy: (1 - second) * 30 });
      goldLine("Te preguntas si vuelve.", 675, pops(t, P.preguntas.start), a, { size: 100 });
    },
    // The product: their birth sky, and a reading written for them.
    (t, l, a) => astramiaReads(t, l, a, {
      phrase: P.astramia,
      text: "No es que no puedas soltar. Es que esa persona tocó justo",
      hidden: "lo que no le muestras a nadie.",
    }),
    (t, l, a) => {
      glyph(t, 0.1 * a);
      line("Pregúntale a tu carta", 280, { size: 104, alpha: a, scale: punch(l) });
      goldLine("si va a volver", 420, pops(t, P.volver.start), a);
      cta(t, l, a, { at: P.empieza.start, url: P.empieza.words[3].start });
    },
  ],
});
</script>
</html>
